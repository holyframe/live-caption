<!doctype html>
<meta charset="utf-8">
<title>Picker test fixture</title>
<style>
  body { font: 18px sans-serif; margin: 40px; }
  textarea, input, [contenteditable] { width: 80%; min-height: 80px; border: 1px solid #777; }
  /* The "fill" case covers the viewport so any point inside the page area is
     inside the input. Tests that cannot read the page can then click blind. */
  #fixture.fill { position: fixed; inset: 0; margin: 0; }
  #fixture.fill textarea { width: 100%; height: 100%; box-sizing: border-box; }
</style>
<h1>Local picker test — no messages are sent</h1>
<main id="fixture"></main>
<script>
const scenario = new URLSearchParams(location.search).get('case') || 'delayed';
const base = 'Picker test fixture ' + scenario;
document.title = base;
const host = document.getElementById('fixture');

// Browsers launched with --disable-renderer-accessibility expose no page at
// all, so tests observe what arrived through the window title instead. The
// submitted messages are counted so a test can tell a send that silently went
// nowhere from one that landed.
const messages = [];
let focused = 0;
function flatten(value) {
    return (value === undefined || value === null ? '' : String(value)).replace(/\s+/g, ' ').trim();
}
function live() {
    const field = host.querySelector('textarea, input, [contenteditable]');
    if (!field) return '';
    return field.value !== undefined ? field.value : field.textContent;
}
function report() {
    // The trailing word of every message, so a test that sends numbered lines
    // can tell which one went missing rather than only that one did.
    const tail = messages.map(message => flatten(message).split(' ').pop()).join(',');
    document.title = base + ' | live=' + flatten(live()) +
        ' last=' + flatten(messages[messages.length - 1]) +
        ' msgs=' + messages.length + ' seq=' + tail + ' focus=' + focused;
}
host.addEventListener('focusin', () => { ++focused; report(); });
host.addEventListener('input', report);
host.addEventListener('keydown', event => {
    if (event.key !== 'Enter') return;
    // Real chat composers submit on Enter and insert a newline on Shift+Enter.
    // A send that still has Shift down therefore looks successful (the text
    // is in the box) while never actually submitting — the hotkey's usual miss.
    if (event.shiftKey) return;
    event.preventDefault();
    const field = event.target;
    messages.push(live());
    if (field.value !== undefined) field.value = '';
    else field.textContent = '';
    report();
});
report();

function addInput() {
    const field = document.createElement(scenario === 'password' ? 'input' : 'textarea');
    field.setAttribute('aria-label', 'Chat message');
    if (scenario === 'readonly') field.readOnly = true;
    if (scenario === 'disabled') field.disabled = true;
    if (scenario === 'password') field.type = 'password';
    if (scenario === 'replace') {
        field.addEventListener('focus', () => {
            // Simulate a framework replacing its composer after it was picked.
            // The sender must reject the stale field, not scan for this clone.
            field.replaceWith(field.cloneNode(true));
            report();
        }, {once: true});
    }
    host.append(field);
}
if (scenario === 'rich') {
    host.innerHTML = '<div contenteditable="true" role="textbox" aria-label="Chat message">rich draft|</div>';
} else if (scenario === 'delayed') {
    setTimeout(addInput, 2500);
} else if (scenario === 'fill') {
    host.classList.add('fill');
    addInput();
} else if (scenario !== 'empty') {
    addInput();
}
</script>
